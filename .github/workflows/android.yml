name: Android build

# Builds the debug APK on every push so Kotlin/Compose compile errors surface
# without a local JDK + Android SDK install.
on:
  push:
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight build of the same ref.
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  assemble-debug:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install compileSdk 36
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Prepare local build files
        run: |
          chmod +x gradlew
          # The build reads local.properties with `?: ""` fallbacks, so a file
          # containing only sdk.dir is enough; B2/YT keys stay empty in CI.
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: Ensure Firebase config
        run: |
          if [ -f app/google-services.json ]; then
            echo "Using the committed app/google-services.json"
          else
            echo "::warning::app/google-services.json is missing; writing a stub. The APK will compile but cannot talk to Firebase."
            cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "minefiy-ci",
              "storage_bucket": "minefiy-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.minetallest.minefiy"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "AIzaSyDUMMY000000000000000000000000000" }
                ],
                "services": {
                  "appinvite_service": { "other_platform_oauth_client": [] }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: minefiy-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
